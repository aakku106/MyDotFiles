#################################
#         ENVIRONMENT           #
#################################
env TERM xterm-256color

#################################
#           FONT                #
#################################
font_family            MesloLGS Nerd Font Mono
bold_font              MesloLGS Nerd Font Mono Bold
italic_font            MesloLGS Nerd Font Mono Italic
bold_italic_font       MesloLGS Nerd Font Mono Bold Italic
font_size              18.0

#################################
#        WINDOW SETTINGS        #
#################################
window_padding_width   0
hide_window_decorations yes
window_margin_width    2
single_window_margin_width 0
macos_option_as_alt    yes

#################################
#        BACKGROUND & STYLE     #
#################################
background_opacity     0.9
blur_background        true
background_image       none
background_tint        0.0
background_tint_gaps   0

#################################
#         TABS & LAYOUTS        #
#################################
tab_bar_edge           bottom
tab_bar_min_tabs       1
tab_bar_style          separator
tab_bar_align          center
tab_bar_margin_width   8
tab_bar_margin_height  4 2
tab_separator          " "
tab_bar_background     #292e42
tab_bar_margin_color   #292e42
tab_title_template     " {index}: {title} "
active_tab_title_template " {index}: {title} "
tab_activity_symbol    *
enabled_layouts        tall,*

#################################
#           THEME               #
#################################
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC
cursor                  #F5E0DC
cursor_text_color       #1E1E2E
url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

macos_titlebar_color    system

active_tab_foreground   #ffffff
active_tab_background   #9d7cd8
inactive_tab_foreground #ffffff
inactive_tab_background #545c7e

mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

color0  #45475A
color1  #F38BA8
color2  #A6E3A1
color3  #F9E2AF
color4  #89B4FA
color5  #F5C2E7
color6  #94E2D5
color7  #BAC2DE
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8

#################################
#           KEYMAPS             #
#################################
kitty_mod ctrl+shift
map cmd+enter new_window_with_cwd
map ctrl+shift+enter launch --cwd=current nvim .

# Session keymaps (tmux-style prefix: ctrl+shift+a)
map ctrl+shift+a>s goto_session
map ctrl+shift+a>c new_tab_with_cwd
map ctrl+shift+a>w save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map ctrl+shift+a>b load_config_file
