# yazi.toml - Updated for yazi 25.12.29+

[manager]
ratio          = [ 2, 3, 5 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 600
max_height    = 900
image_delay   = 30
image_quality = 75

[opener]
edit = [
	{ run = 'nvim "$@"', desc = "nvim", block = true },
]
open = [
	{ run = 'open "$@"', desc = "Open" },
]
reveal = [
	{ run = 'open -R "$1"', desc = "Reveal" },
]

[open]
rules = [
	{ mime = "inode/directory", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	{ mime = "image/*", use = [ "open", "reveal" ] },
	{ mime = "{audio,video}/*", use = [ "open", "reveal" ] },
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
]

[tasks]
micro_workers = 10
macro_workers = 10
bizarre_retry = 3
image_alloc   = 536870912
